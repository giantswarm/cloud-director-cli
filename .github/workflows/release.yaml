name: Release

on:
  push:
    tags:
      - "v*"

env:
  GOLANG_VERSION: 1.22.5

jobs:
  release:
    name: Release & Sign
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@cc23fe1cf04164ea4c208611cf647a013c6f8cc5
        with:
          cosign-release: 'v1.13.6'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0

      - name: Install signing key
        run: |
          echo '${{ secrets.COSIGN_PRIVATE_KEY }}' > cosign.key

      # One token for both repositories GoReleaser writes to: the GitHub
      # release here and the formula in the homebrew-cd-cli tap. The
      # giantswarm-release App is in the tap's main bypass list, so the
      # formula commit goes in without a pull request review.
      - name: Generate giantswarm-release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: giantswarm
          repositories: cloud-director-cli,homebrew-cd-cli
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@b508e2e3ef3b19d4e4146d4f8fb3ba9db644a757 # v3.2.0
        with:
          version: v1.9.2
          args: release --rm-dist
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Cleanup signing keys
        if: ${{ always() }}
        run: rm -f cosign.key || true
